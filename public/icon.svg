<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>
  <defs>
    <linearGradient id="gym_grad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dumbbell Icon -->
  <g filter="url(#glow)">
    <!-- Bar -->
    <rect x="160" y="236" width="192" height="40" rx="8" fill="url(#gym_grad)"/>
    <rect x="180" y="230" width="152" height="52" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    
    <!-- Left Inner Plate -->
    <rect x="120" y="160" width="40" height="192" rx="16" fill="url(#gym_grad)"/>
    <!-- Left Outer Plate -->
    <rect x="70" y="190" width="40" height="132" rx="14" fill="url(#gym_grad)"/>
    <!-- Left Cap -->
    <rect x="44" y="232" width="18" height="48" rx="6" fill="#10b981"/>

    <!-- Right Inner Plate -->
    <rect x="352" y="160" width="40" height="192" rx="16" fill="url(#gym_grad)"/>
    <!-- Right Outer Plate -->
    <rect x="402" y="190" width="40" height="132" rx="14" fill="url(#gym_grad)"/>
    <!-- Right Cap -->
    <rect x="450" y="232" width="18" height="48" rx="6" fill="#10b981"/>
  </g>

  <!-- Accent Star -->
  <path d="M256 120L266 150L298 150L272 168L282 198L256 180L230 198L240 168L214 150L246 150Z" fill="#34d399"/>
</svg>
